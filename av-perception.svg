<svg xmlns="http://www.w3.org/2000/svg" width="480" height="395" viewBox="0 0 480 395" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Camera FOV Cone Gradient -->
    <linearGradient id="fovGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Rotating LiDAR Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Radar Clip to stay inside display -->
    <clipPath id="radarClip">
      <rect x="12" y="34" width="456" height="325" rx="8"/>
    </clipPath>
  </defs>

  <!-- Terminal Window Base -->
  <rect width="480" height="395" rx="12" fill="url(#vbg)"/>
  <rect x="0.5" y="0.5" width="479" height="394" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="30" x2="480" y2="30" stroke="#30363d"/>

  <!-- Titlebar Window Controls -->
  <circle cx="20" cy="15.0" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="15.0" r="5" fill="#27c93f"/>
  <text x="240.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">baysatriow@github: ~/rviz2_perception.sh</text>

  <!-- Radar & Perception Display (Clipped) -->
  <g clip-path="url(#radarClip)">
    <!-- Range Rings (50m, 100m, 150m) -->
    <circle cx="240.0" cy="214.5" r="45" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="240.0" cy="214.5" r="90" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="240.0" cy="214.5" r="135" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

    <!-- Crosshair Axes -->
    <line x1="90.0" y1="214.5" x2="390.0" y2="214.5" stroke="#30363d" stroke-width="0.8" stroke-dasharray="2,4"/>
    <line x1="240.0" y1="69.5" x2="240.0" y2="324.5" stroke="#30363d" stroke-width="0.8" stroke-dasharray="2,4"/>

    <!-- Range Ring Labels -->
    <text x="288.0" y="210.5" fill="#7d8590" font-size="8.5">25m</text>
    <text x="333.0" y="210.5" fill="#7d8590" font-size="8.5">50m</text>
    <text x="378.0" y="210.5" fill="#7d8590" font-size="8.5">75m</text>

    <!-- Forward Camera FOV Vision Cone (110 deg) -->
    <polygon points="240.0,214.5 145.0,69.5 335.0,69.5" fill="url(#fovGrad)"/>
    <line x1="240.0" y1="214.5" x2="145.0" y2="69.5" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="240.0" y1="214.5" x2="335.0" y2="69.5" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- 360-degree Rotating LiDAR Beam -->
    <g transform="translate(240.0,214.5)">
      <path d="M 0 0 L 150 -40 A 155 155 0 0 0 150 40 Z" fill="url(#sweepGrad)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Point Cloud Clusters (LiDAR road & curbs) -->
    <g fill="#22d3ee" opacity="0.75">
      <!-- Left lane boundary points -->
      <circle cx="190.0" cy="194.5" r="1.5"/>
      <circle cx="186.0" cy="169.5" r="1.5"/>
      <circle cx="183.0" cy="144.5" r="1.5"/>
      <circle cx="181.0" cy="119.5" r="1.5"/>
      <circle cx="178.0" cy="94.5" r="1.5"/>
      <!-- Right lane boundary points -->
      <circle cx="290.0" cy="194.5" r="1.5"/>
      <circle cx="294.0" cy="169.5" r="1.5"/>
      <circle cx="297.0" cy="144.5" r="1.5"/>
      <circle cx="299.0" cy="119.5" r="1.5"/>
      <circle cx="302.0" cy="94.5" r="1.5"/>
    </g>

    <!-- Planned Trajectory Path (Smooth Bezier with animated flow) -->
    <path d="M 240.0 214.5 Q 236.0 154.5 248.0 79.5" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- Detected Obstacle 1: Lead Vehicle Ahead (3D Bounding Box) -->
    <!-- Detected Obstacle 1: Lead Vehicle Ahead (Full Vector Car + 3D Bounding Box) -->
    <g transform="translate(245.0,109.5)">
      <!-- 3D Bounding Box Wireframe -->
      <rect x="-16" y="-22" width="32" height="44" rx="3" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="3,2"/>
      
      <!-- Lead Car Model (Top View) -->
      <!-- Wheels -->
      <rect x="-18" y="-18" width="4" height="8" rx="1" fill="#7d8590"/>
      <rect x="14" y="-18" width="4" height="8" rx="1" fill="#7d8590"/>
      <rect x="-18" y="8" width="4" height="8" rx="1" fill="#7d8590"/>
      <rect x="14" y="8" width="4" height="8" rx="1" fill="#7d8590"/>
      <!-- Chassis -->
      <rect x="-13" y="-20" width="26" height="38" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
      <!-- Windshields -->
      <path d="M -9 -10 L 9 -10 L 7 -3 L -7 -3 Z" fill="#3fb950" fill-opacity="0.25"/>
      <path d="M -8 5 L 8 5 L 7 11 L -7 11 Z" fill="#3fb950" fill-opacity="0.2"/>
      <!-- Red Taillights -->
      <circle cx="-9" cy="17" r="2" fill="#ef4444"/>
      <circle cx="9" cy="17" r="2" fill="#ef4444"/>
      <!-- Front Lights -->
      <circle cx="-9" cy="-19" r="1.5" fill="#22d3ee"/>
      <circle cx="9" cy="-19" r="1.5" fill="#22d3ee"/>

      <!-- Velocity / Heading Vector Arrow -->
      <line x1="0" y1="-20" x2="0" y2="-32" stroke="#3fb950" stroke-width="1.5"/>
      <polygon points="0,-35 -3,-30 3,-30" fill="#3fb950"/>

      <!-- Track Tag Label -->
      <rect x="-30" y="-46" width="60" height="10" rx="2" fill="#0d1117" stroke="#3fb950" stroke-width="0.8"/>
      <text x="0" y="-38" fill="#3fb950" font-size="7.5" font-weight="700" text-anchor="middle">CAR #01 : 42m</text>
    </g>

    <!-- Detected Obstacle 2: Pedestrian / Obstacle on Right -->
    <g transform="translate(315.0,164.5)">
      <circle cx="0" cy="0" r="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.2">
        <animate attributeName="r" values="7;10;7" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="-18" width="36" height="9" rx="2" fill="#0d1117" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="0" y="-11" fill="#f59e0b" font-size="7" font-weight="700" text-anchor="middle">PED : 28m</text>
    </g>

    <!-- Ego-Vehicle (Self-Driving Car at Center) -->
    <g transform="translate(240.0,214.5)">
      <!-- Wheels -->
      <rect x="-16" y="-18" width="5" height="10" rx="1.5" fill="#7d8590"/>
      <rect x="11" y="-18" width="5" height="10" rx="1.5" fill="#7d8590"/>
      <rect x="-16" y="8" width="5" height="10" rx="1.5" fill="#7d8590"/>
      <rect x="11" y="8" width="5" height="10" rx="1.5" fill="#7d8590"/>
      <!-- Chassis -->
      <rect x="-12" y="-22" width="24" height="44" rx="6" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
      <!-- Windshield & Glass -->
      <path d="M -9 -10 L 9 -10 L 7 -2 L -7 -2 Z" fill="#22d3ee" fill-opacity="0.25"/>
      <path d="M -8 8 L 8 8 L 7 14 L -7 14 Z" fill="#22d3ee" fill-opacity="0.2"/>
      <!-- Roof LiDAR Sensor Puck with pulsing wave -->
      <circle cx="0" cy="3" r="4.5" fill="#38bdf8" stroke="#c9d1d9" stroke-width="1"/>
      <circle cx="0" cy="3" r="8" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.7">
        <animate attributeName="r" values="4.5;14" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <!-- Forward Headlight Beams -->
      <polygon points="-9,-22 -16,-34 -7,-34 -6,-22" fill="#22d3ee" fill-opacity="0.3"/>
      <polygon points="9,-22 16,-34 7,-34 6,-22" fill="#22d3ee" fill-opacity="0.3"/>
    </g>

    <!-- Corner Telemetry Overlay HUD Badges -->
    <g font-size="9" font-weight="700">
      <!-- Top Left: Node Status -->
      <rect x="20" y="42" width="118" height="18" rx="4" fill="#0d1117" fill-opacity="0.85" stroke="#30363d" stroke-width="0.8"/>
      <circle cx="28" cy="51" r="3" fill="#3fb950"/>
      <text x="36" y="54" fill="#c9d1d9">LiDAR: <tspan fill="#3fb950">20Hz LOCK</tspan></text>

      <!-- Top Right: Perception Track Count -->
      <rect x="342" y="42" width="118" height="18" rx="4" fill="#0d1117" fill-opacity="0.85" stroke="#30363d" stroke-width="0.8"/>
      <text x="350" y="54" fill="#c9d1d9">TRACKS: <tspan fill="#22d3ee">2 OBJECTS</tspan></text>

      <!-- Bottom Left: Autonomous Mode -->
      <rect x="20" y="337" width="124" height="18" rx="4" fill="#0d1117" fill-opacity="0.85" stroke="#30363d" stroke-width="0.8"/>
      <text x="28" y="349" fill="#c9d1d9">MODE: <tspan fill="#22d3ee">AUTONOMOUS</tspan></text>

      <!-- Bottom Right: Latency & Fusion -->
      <rect x="352" y="337" width="108" height="18" rx="4" fill="#0d1117" fill-opacity="0.85" stroke="#30363d" stroke-width="0.8"/>
      <text x="360" y="349" fill="#c9d1d9">LATENCY: <tspan fill="#3fb950">11.2ms</tspan></text>
    </g>
  </g>

  <!-- Bottom Command Status Bar -->
  <line x1="0" y1="363" x2="480" y2="363" stroke="#30363d"/>
  <text x="20" y="383" fill="#7d8590" font-size="11.5">
    baysatriow@github:~$ <tspan fill="#3fb950">rviz2</tspan> <tspan fill="#22d3ee">-d perception.rviz</tspan>
  </text>
  <rect x="235" y="372" width="7" height="13" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>